# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Sérgio Santos
subtitle: Senior Software Engineer · Back-end
# Keep the current overall experience claim provisional; do not imply years with individual technologies.
description: Senior Software Engineer com 9+ anos de experiência em engenharia back-end, APIs e sistemas distribuídos.
keywords: Node.js, TypeScript, NestJS, AWS, Microservices, Backend, Software Engineer
author: Sérgio Santos
language: pt-BR
timezone: America/Recife

# URL
url: https://sergingroisman.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - index.html
  - portfolio/index.html
  - brag/index.html

# Writing
new_post_name: :title.md # File name for new posts
default_layout: post
titlecase: false # Transform post titles to titlecase
external_link:
  enable: true # Open external links in a new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Keep the generated post index at /blog/; the standalone Bio owns /
index_generator:
  path: blog
  per_page: 10
  order_by: -date
  layout:
    - blog

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display dates
## You can customize formats as defined in Moment.js documentation.
date_format: DD/MM/YYYY
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment is intentionally configured only in .github/workflows/deploy.yml.
